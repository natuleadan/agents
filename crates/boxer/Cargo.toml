[package]
name = "agents-boxer"
version.workspace = true
edition.workspace = true
description = "Sandbox container runner, dual-loop supervisor, and Traefik preview daemon"
license.workspace = true
publish = false

[dependencies]
agents-protocol = { path = "../protocol" }
async-nats = "0.42"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
ironic = { version = "1.3.0", features = ["validation", "security", "serialization", "uuid", "logging", "scheduling"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
scalar_api_reference = { version = "0.2", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
