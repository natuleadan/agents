[package]
name = "agents-boxer"
version = "0.0.0"
edition = "2024"
description = "Sandbox container runner, dual-loop supervisor, and Traefik preview daemon"
license = "Apache-2.0"
publish = false

[dependencies]
agents-protocol = { path = "../protocol" }
async-nats = "0.42"
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[lints]
workspace = true
