[package]
name = "agents-client"
version = "0.0.0"
edition = "2024"
description = "Multi-device client interface for interacting with the agents orchestrator"
license = "Apache-2.0"
publish = false

[dependencies]
agents-protocol = { path = "../protocol" }
agents-styles = { path = "../styles" }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = { version = "2.2", default-features = false }
hex = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "layout-cache", "macros", "underline-color"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "macros"] }
tracing = "0.1"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.43", features = ["full"] }

[dev-dependencies]
agents-server = { path = "../server" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
