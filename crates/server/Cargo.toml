[package]
name = "agents-server"
version = "0.0.0"
edition = "2024"
description = "Orchestrator server exposing the API, coordinating workflows, database, Valkey, NATS and autocron"
license = "Apache-2.0"
publish = false

[dependencies]
agents-protocol = { path = "../protocol" }
agents-styles = { path = "../styles" }
argon2 = "0.5"
async-nats = "0.42"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
futures-util = "0.3"
garde = { version = "0.23", features = ["derive", "email"] }
hex = "0.4"
ironic = { version = "1.3.0", features = [
    "sqlx-postgres",
    "redis",
    "auth",
    "jwt",
    "validation",
    "security",
    "compression",
    "metrics",
    "openapi",
    "mcp",
    "realtime",
    "sse",
    "logging",
    "uuid",
    "serialization",
] }
jsonwebtoken = "9"
redis = { version = "1.3", default-features = false, features = ["aio", "tokio-comp", "connection-manager", "script"] }
scalar_api_reference = { version = "0.2", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "json"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.29"

[lints]
workspace = true
