[package]
name = "agents-protocol"
version = "0.0.0"
edition = "2024"
description = "Common protocol types, DTOs and messaging contracts for the agents harness"
license = "Apache-2.0"
publish = false

[dependencies]
ironic = { version = "1.3.0", default-features = false, features = ["openapi"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
openapi = ["dep:ironic"]

[lints]
workspace = true
