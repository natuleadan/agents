[workspace]
members = [
    "crates/protocol",
    "crates/styles",
    "crates/server",
    "crates/boxer",
    "crates/installer",
    "crates/client",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
